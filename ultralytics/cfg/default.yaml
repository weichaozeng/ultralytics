spad_rgb_mode: gray
spad_packed_reduce: any
spad_bayer_pattern: RGGB
spad_packed_ch_order: RGB
spad_swap_rb: false
# Global configuration YAML with settings and hyperparameters for YOLO training, validation, prediction and export
# For documentation see https://docs.ultralytics.com/usage/cfg/

task: detect # (str) YOLO task, i.e. detect, segment, classify, pose, obb
mode: train # (str) YOLO mode, i.e. train, val, predict, export, track, benchmark

# Train settings -------------------------------------------------------------------------------------------------------
model: # (str, optional) path to model file, i.e. yolov8n.pt or yolov8n.yaml
data: # (str, optional) path to data file, i.e. coco8.yaml
epochs: 100 # (int) number of epochs to train for
time: # (float, optional) max hours to train; overrides epochs if set
patience: 100 # (int) early stop after N epochs without val improvement
batch: 16 # (int) batch size; use -1 for AutoBatch
imgsz: 640 # (int | list) train/val use int (square); predict/export may use [h,w]
save: True # (bool) save train checkpoints and predict results
save_period: -1 # (int) save checkpoint every N epochs; disabled if < 1
cache: False # (bool | str) cache images in RAM (True/'ram') or on 'disk' to speed dataloading; False disables
device: # (int | str | list) device: 0 or [0,1,2,3] for CUDA, 'cpu'/'mps', or -1/[-1,-1] to auto-select idle GPUs
workers: 0 # (int) dataloader workers (per RANK if DDP)
project: # (str, optional) project name for results root
name: # (str, optional) experiment name; results in 'project/name'
exist_ok: False # (bool) overwrite existing 'project/name' if True
pretrained: True # (bool | str) use pretrained weights (bool) or load weights from path (str)
optimizer: auto # (str) optimizer: SGD, Adam, Adamax, AdamW, NAdam, RAdam, RMSProp, or auto
verbose: True # (bool) print verbose logs during training/val
seed: 0 # (int) random seed for reproducibility
deterministic: True # (bool) enable deterministic ops; reproducible but may be slower
single_cls: False # (bool) treat all classes as a single class
rect: False # (bool) rectangular batches for train; rectangular batching for val when mode='val'
cos_lr: False # (bool) cosine learning rate scheduler
close_mosaic: 10 # (int) disable mosaic augmentation for final N epochs (0 to keep enabled)
resume: False # (bool) resume training from last checkpoint in the run dir
amp: True # (bool) Automatic Mixed Precision (AMP) training; True runs AMP capability check
fraction: 1.0 # (float) fraction of training dataset to use (1.0 = all)
profile: False # (bool) profile ONNX/TensorRT speeds during training for loggers
freeze: # (int | list, optional) freeze first N layers (int) or specific layer indices (list)
multi_scale: False # (bool) multiscale training by varying image size
compile: False # (bool | str) enable torch.compile() backend='inductor'; True="default", False=off, or "default|reduce-overhead|max-autotune-no-cudagraphs"

# Segmentation
overlap_mask: True # (bool) merge instance masks into one mask during training (segment only)
mask_ratio: 4 # (int) mask downsample ratio (segment only)

# Classification
dropout: 0.0 # (float) dropout for classification head (classify only)

# Val/Test settings ----------------------------------------------------------------------------------------------------
val: True # (bool) run validation/testing during training
split: val # (str) dataset split to evaluate: 'val', 'test' or 'train'
save_json: False # (bool) save results to COCO JSON for external evaluation
conf: # (float, optional) confidence threshold; defaults: predict=0.25, val=0.001
iou: 0.7 # (float) IoU threshold used for NMS
max_det: 300 # (int) maximum number of detections per image
half: False # (bool) use half precision (FP16) if supported
dnn: False # (bool) use OpenCV DNN for ONNX inference
plots: True # (bool) save plots and images during train/val

# Predict settings -----------------------------------------------------------------------------------------------------
source: # (str, optional) path/dir/URL/stream for images or videos; e.g. 'ultralytics/assets' or '0' for webcam
vid_stride: 1 # (int) read every Nth frame for video sources
stream_buffer: False # (bool) True buffers all frames; False keeps the most recent frame for low-latency streams
visualize: False # (bool) visualize model features (predict) or TP/FP/FN confusion (val)
augment: False # (bool) apply test-time augmentation during prediction
agnostic_nms: False # (bool) class-agnostic NMS
classes: # (int | list[int], optional) filter by class id(s), e.g. 0 or [0,2,3]
retina_masks: False # (bool) use high-resolution segmentation masks (segment)
embed: # (list[int], optional) return feature embeddings from given layer indices

# Visualize settings ---------------------------------------------------------------------------------------------------
show: False # (bool) show images/videos in a window if supported
save_frames: False # (bool) save individual frames from video predictions
save_txt: False # (bool) save results as .txt files (xywh format)
save_conf: False # (bool) save confidence scores with results
save_crop: False # (bool) save cropped prediction regions to files
show_labels: True # (bool) draw class labels on images, e.g. 'person'
show_conf: True # (bool) draw confidence values on images, e.g. '0.99'
show_boxes: True # (bool) draw bounding boxes on images
line_width: # (int, optional) line width of boxes; auto-scales with image size if not set

# Export settings ------------------------------------------------------------------------------------------------------
format: torchscript # (str) target format, e.g. torchscript|onnx|openvino|engine|coreml|saved_model|pb|tflite|edgetpu|tfjs|paddle|mnn|ncnn|imx|rknn|executorch
keras: False # (bool) TF SavedModel only (format=saved_model); enable Keras layers during export
optimize: False # (bool) TorchScript only; apply mobile optimizations to the scripted model
int8: False # (bool) INT8/PTQ where supported (openvino, tflite, tfjs, engine, imx); needs calibration data/fraction
dynamic: False # (bool) dynamic shapes for torchscript, onnx, openvino, engine; enable variable image sizes
simplify: True # (bool) ONNX/engine only; run graph simplifier for cleaner ONNX before runtime conversion
opset: # (int, optional) ONNX/engine only; opset version for export; leave unset to use a tested default
workspace: # (float, optional) engine (TensorRT) only; workspace size in GiB, e.g. 4
nms: False # (bool) fuse NMS into exported model when backend supports; if True, conf/iou apply (agnostic_nms except coreml)

# Hyperparameters ------------------------------------------------------------------------------------------------------
lr0: 0.01 # (float) initial learning rate (SGD=1e-2, Adam/AdamW=1e-3)
lrf: 0.01 # (float) final LR fraction; final LR = lr0 * lrf
momentum: 0.937 # (float) SGD momentum or Adam beta1
weight_decay: 0.0005 # (float) weight decay (L2 regularization)
warmup_epochs: 3.0 # (float) warmup epochs (fractions allowed)
warmup_momentum: 0.8 # (float) initial momentum during warmup
warmup_bias_lr: 0.1 # (float) bias learning rate during warmup
box: 7.5 # (float) box loss gain
cls: 0.5 # (float) classification loss gain
dfl: 1.5 # (float) distribution focal loss gain
pose: 12.0 # (float) pose loss gain (pose tasks)
kobj: 1.0 # (float) keypoint objectness loss gain (pose tasks)
nbs: 64 # (int) nominal batch size used for loss normalization
hsv_h: 0.015 # (float) HSV hue augmentation fraction
hsv_s: 0.7 # (float) HSV saturation augmentation fraction
hsv_v: 0.4 # (float) HSV value (brightness) augmentation fraction
degrees: 0.0 # (float) rotation degrees (+/-)
translate: 0.1 # (float) translation fraction (+/-)
scale: 0.5 # (float) scale gain (+/-)
shear: 0.0 # (float) shear degrees (+/-)
perspective: 0.0 # (float) perspective fraction (0–0.001 typical)
flipud: 0.0 # (float) vertical flip probability
fliplr: 0.5 # (float) horizontal flip probability
bgr: 0.0 # (float) RGB↔BGR channel swap probability
mosaic: 1.0 # (float) mosaic augmentation probability
mixup: 0.0 # (float) MixUp augmentation probability
cutmix: 0.0 # (float) CutMix augmentation probability
copy_paste: 0.0 # (float) segmentation copy-paste probability
copy_paste_mode: flip # (str) copy-paste strategy for segmentation: flip or mixup
auto_augment: randaugment # (str) classification auto augmentation policy: randaugment, autoaugment, augmix
erasing: 0.4 # (float) random erasing probability for classification (0–0.9), <1.0

# Custom config.yaml ---------------------------------------------------------------------------------------------------
cfg: # (str, optional) path to a config.yaml that overrides defaults

# Tracker settings ------------------------------------------------------------------------------------------------------
tracker: botsort.yaml # (str) tracker config file: botsort.yaml or bytetrack.yaml

# SPAD (custom) -------------------------------------------------------------------------------------------------------
spad: False # (bool) enable SPAD photon-cube preprocessing pipeline
spad_pre: perpixelbayesian # (str) SPAD preprocessor name, e.g. 'perpixelbayesian'
spad_clear_states: False # (bool) reset SPAD preprocessor state at sequence start
spad_bayes_kwargs: {} # (dict) kwargs forwarded to PerPixelBayesian/process_photon_cube (normalize forced False in SPAD pipeline)
spad_collapse: recon # (str) how to turn cube into frames, e.g. 'recon' or other future modes
spad_chunk_t: # (int, optional) chunk length in T for streaming large cubes
spad_t_offset: 0 # (int) absolute T offset for causal alignment/debugging
spad_enabled: True # (bool) enable the end-to-end SPAD pose model path
spad_train_json: /home/zvc/Data/visionsim/outputs/train_8kHz.json # (str, optional) VisionSIM 8 kHz training split json
spad_test_json: /home/zvc/Data/visionsim/outputs/test_8kHz.json # (str, optional) VisionSIM 8 kHz test split json
spad_output_frames: 5 # (int) reconstructed output frames per training window
spad_chunk_size: 80 # (int) raw-bin chunk size for frame-mode SPAD training/inference (2 kHz: 80 = 5 GT)
spad_stride_frames: 5 # (int) sliding-window stride in GT frame units for the sequence baseline
spad_bins_per_gt: 16 # (int) raw SPAD bins per one GT frame (2000 FPS / 125 FPS GT = 16)
spad_image_size: 512 # (int) square image size for SPAD pose windows
spad_packed_ch_order: RGB # (str) packed SPAD channel order used when unpacking raw windows
spad_subsampling: 80 # (int) shared temporal downsampling factor for SPAD preprocessors and GT alignment
spad_bin_rate_hz: 2000.0 # (float) reference raw-bin frequency used to normalize detector-side SSD time deltas
spad_input_gamma: 2.2 # (float) gamma correction applied to reconstructed detector inputs
spad_cache_mode: auto # (str) frame-mode detector input source: auto, raw, or rendered
spad_render_root: # (str, optional) root directory containing cached rendered frames
spad_render_contains_confidence: False # (bool) whether cached renders include confidence.npy for UA/residual adapters
spad_source_render_dirname: renders-spc2kHz # (str) source render dirname used to infer sibling rendered cache roots
spad_preprocessor: ppb # (str) detector input preprocessor: ppb, sum, ema, stea, hire
spad_plugin: temporal_ssd # (str) detector-side feature plugin: none, temporal_ssd, temporal_attn, sr_attn, window_st_attn, spatial_only, spatial_temporal
spad_frame_adapter: ua # (str) frame-mode image-space adapter: none, residual, ua
spad_plugin_scales: 16,19,22 # (str) comma-separated YOLO layer indices for detector plugins
spad_temporal_core: ssd # (str) temporal core used by plugins: ssd, temporal_attn, sr_attn, window_st_attn
spad_freeze_detector: True # (bool) freeze pretrained detector while training SPAD modules
spad_eval_max_batches: -1 # (int) max test batches for SPAD eval visualization (-1 = full split)
spad_eval_seed: 0 # (int) seed for SPAD eval sampling
spad_viz_batches: 1 # (int) number of SPAD eval batches to visualize
spad_viz_frames: 4 # (int) max reconstructed frames to visualize per eval batch
spad_viz_period: 10 # (int) eval visualization period in epochs (0 disables periodic viz)
spad_viz_conf: 0.25 # (float) confidence threshold used in SPAD eval visualization
spad_viz_iou: 0.7 # (float) IoU threshold used in SPAD eval visualization
spad_viz_max_det: 20 # (int) max detections per frame used in SPAD eval visualization
ppb_bocpd_gamma: 0.001 # (float) BOCPD hazard rate for PerPixelBayesian
ppb_quantile: 1.0 # (float) normalization quantile for PerPixelBayesian
ppb_normalize: True # (bool) normalize PerPixelBayesian reconstructions
ppb_memory_size: 10 # (int) runlength forecaster memory set size for PerPixelBayesian
ppb_min_filter_size: 5 # (int) odd min-filter size for PerPixelBayesian
ema_alpha: 0.01 # (float) EMA new-sample weight (inference standard); <=0 => 2/(spad_subsampling+1) SMA-equivalent
ema_normalize: True # (bool) normalize EMA reconstructions
ema_quantile: 1.0 # (float) normalization quantile for EMA
sum_normalize: True # (bool) normalize sum reconstructions
sum_quantile: 1.0 # (float) normalization quantile for sum
stea_fast_window: 16 # (int) fast Gamma temporal basis length for STEA
stea_slow_window: 128 # (int) slow boxcar temporal basis length for STEA
stea_temporal_window: 5 # (int) causal evidence blur window for STEA
stea_fast_tau: 6.0 # (float) Gamma tau for the fast STEA basis
stea_motion_sharpness: 60.0 # (float) motion routing sharpness for STEA
stea_motion_threshold: 0.07 # (float) motion routing threshold for STEA
stea_stable_prior: 16.0 # (float) stable-branch prior for STEA
stea_normalize: True # (bool) normalize STEA reconstructions
stea_quantile: 1.0 # (float) normalization quantile for STEA
# HIRE v0.3: α=exp(-1/W) from *_bins
hire_fast_bins: 24 # (int) W_f: α_f=exp(-1/W_f), n_f cap
hire_slow_bins: 160 # (int) W_s: α_s=exp(-1/W_s), n_s cap (~2×chunk)
hire_surprise_bins: 4 # (int) W_S: α_S=exp(-1/W_S) for surprise EMA
hire_mix_hold_bins: 80 # (int) hold full I^f after reset; <0 => chunk/subsampling (legacy); 0 => no hold
hire_mix_bins: 12.0 # (float) τ after hold: g=exp(-(t-H)/τ) toward I^s
hire_mix_theta: 0.06 # (float) soft gate on relu(S̄-θ_floor); <=0 disables
hire_mix_floor: -1.0 # (float) soft deadzone; <0 => use hire_theta_off (kills background I^f bleed)
hire_theta_on: 0.08 # (float) enter / confirm seed if S̄>θ_on → hard I^s←I^f
hire_theta_off: 0.02 # (float) leave change if S̄<θ_off; also default soft floor / grow support
hire_theta_grow: -1.0 # (float) geodesic support S̄>θ_grow; <0 => use hire_theta_off
hire_confirm_bins: 4 # (int) bins in-change before sustained hard reset (confirm≥C each bin)
hire_cooldown_bins: 0 # (int) unused; n_f/n_s←W_f after reset replaces anti-chatter
hire_spatial_kernel: 5 # (int) odd pool on S before in_change / hard-reset / soft-gate thresholds
hire_gate_pool: max # (str) spatial pool on S: avg=denoise spikes | max=connect blobs
hire_reset_open: 15 # (int) odd morph open on seeds (1=off; >1 kills thin edge seeds)
hire_reset_grow: 6 # (int) geodesic dilate steps of seed inside {S̄>θ_grow}
hire_normalize: True
hire_quantile: 1.0
ssd_state_dim: 20 # (int) latent state dimension for SSD temporal blocks
ssd_head_divisor: 4 # (int) derive SSD head dim from channels // divisor
attn_state_dim: 8 # (int) bottleneck state width for attention temporal blocks (attn_dim = num_heads * attn_state_dim)
attn_head_divisor: 4 # (int) derive attention head dim from channels // divisor
attn_dropout: 0.0 # (float) dropout for attention temporal blocks
attn_sr_ratio: 2 # (int) default spatial-reduction ratio for sr_attn plugins
attn_window_size: [3, 7, 7] # (list) default window size [T,H,W] for window_st_attn plugins
attn_max_history: 20 # (int) online KV cache length for temporal_attn / sr_attn (frames)
spad_spatial_reduce_ratio: 2 # (int) channel bottleneck ratio for spatial detector plugins
spad_spatial_kernel_size: 3 # (int) depthwise kernel size for spatial detector plugins
spad_plugin_alpha_init: 0.0 # (float) initial residual gate value for detector plugins
spad_frame_adapter_alpha_init: 0.0 # (float) initial residual gate value for the frame-mode adapter
rgb_fps: 25.0 # (float) RGB camera FPS for VisionSIM rgb25fps finetune alignment
rgb_gt_rate_hz: 125.0 # (float) GT annotation rate used with RGB finetune (matches SPAD bins_per_gt timing)
rgb_frame_source: rgb # (str) detector-finetune input: rgb, or offline cache sum/ema/ppb/stea/hire
rgb_val_samples: 5 # (int) number of test videos held out for RGB finetune val each epoch
rgb_val_seed: 0 # (int) RNG seed for choosing the fixed RGB val video subset
spad_render_tag: 2kHz # (str) sibling cache suffix: renders-{prep}-{tag}; empty => renders-{prep}

