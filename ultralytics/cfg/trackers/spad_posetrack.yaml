# SPADPoseTrack: PoseTrack + dense velocity field export
tracker_type: spad_posetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.62
# Stage-2: tracked+lost with pose+box dists; stricter thresh reduces low-score ID switches
second_match_thresh: 0.8
fuse_score: true
remove_duplicate_stracks: false

# Lost track survival (track_buffer is ignored; use this instead)
lost_track_max_frames: 30
lost_pose_recall_frames: 4
motion_pose_recall_max: 0.55
dead_line_velocity_scale: 0.5
velocity_bonus_min_speed: 2.0

# Suppress redundant new tracks from unmatched high-score dets
new_track_ioa_thresh: 0.65
new_track_pose_dissim_thresh: 0.25

# Motion-gated association
box_weight: 0.25
box_weight_second: 0.35
motion_box_weight: 0.75
motion_speed_ref: 8.0
motion_speed_min: 1.0
motion_dir_weight: 0.5

# Result keypoints: detector = matched det kpts (BoTSORT-style); filtered = pose-KF output
pose_output: detector

# Pose association
n_keypoints: 21
kpt_dims: 3
pose_weight: 0.75
pose_weight_second: 0.65
proximity_thresh: 0.5
pose_match_thresh: 0.0
pose_metric: hybrid
kpt_conf_thresh: 0.3
oks_sigma: 0.05
match_weight_depth: [1.0, 1.0, 0.85, 0.70, 0.50]
box_gate_thresh: 9.488
dead_line_scale: 3.0
pose_reliable_thresh: 0.25
use_maha_gating: true

# Handedness belief smoothing
handedness_filter: true
cls_learning_rate: 0.3
cls_init_strength: 2.0
cls_soft_match_penalty: 0.1

# Pose-aware NMS (used automatically when this tracker is selected)
point_thres: 0.25
bone_thres: 0.25
ioa_thres: 0.65

# Velocity field export
field_value_source: predicted
field_sigma_scale_x: 0.35
field_sigma_scale_y: 0.35
field_min_sigma: 2.0
field_min_weight: 1.0e-4
field_max_speed: 32.0
field_extent: 3.0
prediction_horizon: 1.0
