# --- General Parameters ---
# nc: Number of classes 
nc: 2
# kpt_shape: Keypoint shape [num_keypoints, num_dims (usually 3 for x, y, conf)]
kpt_shape: [21, 3]

# --- Scaling ---
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.5, 1024]
  m: [0.67, 0.75, 768]
  l: [1.0, 1.0, 512]
  x: [1.0, 1.25, 512]

# --- Backbone ---
backbone:
  # [module, repeats, args]
  [[-1, 1, Conv, [64, 3, 2]], # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]], # 1-P2/4
   [-1, 3, C2f, [128, True]], # 2
   [-1, 1, Conv, [256, 3, 2]], # 3-P3/8
   [-1, 6, C2f, [256, True]], # 4
   [-1, 1, Conv, [512, 3, 2]], # 5-P4/16
   [-1, 6, C2f, [512, True]], # 6
   [-1, 1, Conv, [1024, 3, 2]], # 7-P5/32
   [-1, 3, C2f, [1024, True]], # 8
   [-1, 1, SPPF, [1024, 5]] # 9
  ]

# --- Head / Neck ---
head:
  [[-1, 1, nn.Upsample, ['None', 2, 'nearest']], # 10
   [[ -1, 6], 1, Concat, [1]], # 11 (Concat P5_up with P4_backbone)
   [-1, 3, C2f, [512]], # 12 (P4)
   
   [-1, 1, nn.Upsample, ['None', 2, 'nearest']], # 13
   [[ -1, 4], 1, Concat, [1]], # 14 (Concat P4_up with P3_backbone)
   [-1, 3, C2f, [256]], # 15 (P3, smallest scale)
   
   # P4/16 Downsample
   [-1, 1, Conv, [256, 3, 2]], # 16 
   [[ -1, 12], 1, Concat, [1]], # 17 (Concat P4_down with P4_backbone_output)
   [-1, 3, C2f, [512]], # 18 (P4, medium scale)
   
   # P5/32 Downsample
   [-1, 1, Conv, [512, 3, 2]], # 19
   [[ -1, 9], 1, Concat, [1]], # 20 (Concat P5_down with P5_backbone_output)
   [-1, 3, C2f, [1024]], # 21 (P5, largest scale)
   
   

   [[15, 18, 21], 1, Pose, [nc, kpt_shape]] # 22
  ]

scale: m

yaml_file: yolov8m-custom-pose.yaml
ch: 3