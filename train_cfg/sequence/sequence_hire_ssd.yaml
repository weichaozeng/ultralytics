spad_train_mode: sequence
model: /home/zvc/Project/SPADHand/ultralytics/weights/detector.pt

spad_train_json: /home/zvc/Data/visionsim/outputs/train.json
spad_test_json: /home/zvc/Data/visionsim/outputs/test.json

project: Runs/spad_pose
name: sequence_hire_ssd
device: "0"
epochs: 60
spad_viz_period: 10
batch: 2
workers: 0
imgsz: 512

# sequence windowing (10 consecutive cached frames per sample)
spad_output_frames: 20
spad_chunk_size: 320
spad_subsampling: 64
spad_bins_per_gt: 64
spad_stride_frames: 5
spad_image_size: 512
spad_packed_ch_order: RGB
spad_cache_mode: auto

# HIRE offline cache (forward skips online preprocessing when cache_mode=rendered)
spad_preprocessor: hire
hire_ref_rate_hz: 8000.0
hire_fast_bins: 16
hire_slow_bins: 128
hire_surprise_bins: 8
hire_gate_theta: 0.05
hire_spatial_kernel: 3

# backbone SSD plugins (no frame_adapter). Use "backbone" to auto-match YOLOv8/v11 layer ids.
spad_plugin: temporal_ssd
spad_plugin_scales: backbone
ssd_state_dim: 20
ssd_head_divisor: 4
spad_spatial_reduce_ratio: 2
spad_spatial_kernel_size: 3
spad_plugin_alpha_init: 0.0

spad_bin_rate_hz: 8000.0
spad_input_gamma: 2.2
spad_freeze_detector: true
