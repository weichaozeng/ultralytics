spad_train_mode: sequence
model: /home/zvc/Project/SPADHand/ultralytics/weights/detector.pt

spad_train_json: /home/zvc/Data/visionsim/outputs/train_8kHz.json
spad_test_json: /home/zvc/Data/visionsim/outputs/test_8kHz.json

project: Runs/spad_pose
name: sequence_hire_attn_tp_8kHz
device: "0"
epochs: 60
spad_viz_period: 10
batch: 2
workers: 0
imgsz: 512

# 8 kHz / GT 125 Hz: bins_per_gt=64; chunk=320 (=5 GT)
spad_output_frames: 20
spad_chunk_size: 320
spad_subsampling: 64
spad_bins_per_gt: 64
spad_stride_frames: 5
spad_image_size: 512
spad_packed_ch_order: RGB
spad_cache_mode: auto
spad_source_render_dirname: renders-spc8kHz
spad_render_contains_confidence: false

# HIRE offline cache @ 8 kHz (same HIRE hyperparams as 2 kHz)
spad_preprocessor: hire
hire_fast_bins: 24
hire_slow_bins: 160
hire_surprise_bins: 4
hire_mix_hold_bins: 80
hire_mix_bins: 12.0
hire_mix_theta: 0.06
hire_mix_floor: -1.0
hire_theta_on: 0.08
hire_theta_off: 0.02
hire_theta_grow: -1.0
hire_confirm_bins: 4
hire_cooldown_bins: 0
hire_spatial_kernel: 5
hire_gate_pool: max
hire_reset_open: 15
hire_reset_grow: 6
hire_normalize: true
hire_quantile: 1.0

# backbone temporal-attention
spad_plugin: temporal_attn
spad_plugin_scales: backbone
attn_state_dim: 8
attn_head_divisor: 4
attn_dropout: 0.0
attn_sr_ratio: 2
attn_window_size: [3, 7, 7]
spad_spatial_reduce_ratio: 2
spad_spatial_kernel_size: 3
spad_plugin_alpha_init: 0.0

spad_bin_rate_hz: 8000.0
spad_input_gamma: 2.2
spad_freeze_detector: true
