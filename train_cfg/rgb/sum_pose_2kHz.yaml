# Full-parameter finetune of detector.pt on offline sum-2kHz caches
# (renders-sum-2kHz / JSON `sum` paths), same split as sequence_*_2kHz.
#
# vs rgb_pose_2kHz.yaml: same trainer (RgbPoseTrainer / PoseModel, unfrozen),
# but frames come from sum preprocessing instead of clean RGB.
#
# Epochs: full finetune from a strong pretrained detector converges faster than
# frozen-detector SPAD plugin training (60). Prefer ~20; raise to 30 if val
# loss is still dropping. Use patience / early stop if available.
model: /home/zvc/Project/SPADHand/ultralytics/weights/detector.pt

spad_train_json: /home/zvc/Data/visionsim/outputs/train_2kHz.json
spad_test_json: /home/zvc/Data/visionsim/outputs/test_2kHz.json

project: Runs/spad_pose
name: sum_pose_2kHz
device: "2"
epochs: 20
spad_viz_period: 5
batch: 40
workers: 0
imgsz: 512

# Offline sum cache @ 2 kHz (chunk=80 = 5 GT @ 125 Hz)
rgb_frame_source: sum
spad_preprocessor: sum
spad_chunk_size: 80
spad_subsampling: 80
spad_bins_per_gt: 16
spad_stride_frames: 5
spad_image_size: 512
spad_packed_ch_order: RGB
spad_source_render_dirname: renders-spc2kHz
spad_render_tag: 2kHz
spad_render_contains_confidence: false
spad_input_gamma: 2.2
sum_normalize: true
sum_quantile: 1.0

# Open-train the detector (no SPAD plugins)
spad_freeze_detector: false
